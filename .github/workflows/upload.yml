name: Onaylı videoları YouTube'a zamanla

# Claude Code takımı onaylı paketleri queue/ altına koyup kendi branch'ine push eder.
# Bu iş paketleri render eder ve saatine zamanlayarak yükler. YouTube anahtarları sadece burada (GitHub Secrets).
on:
  push:
    branches: ["claude/**"]
    paths: ["queue/**"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Paketlerin bulunduğu branch"
        required: true

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event.inputs.ref || github.ref }}", path: pkg }
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event.repository.default_branch }}", path: site }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: pkg/requirements.txt }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core && pip install -r pkg/requirements.txt
      - name: Render + zamanlanmış yükleme
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python pkg/pipeline/publish.py upload --queue pkg/queue --site site | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Geçmişi ana branch'e yaz
        working-directory: site
        run: |
          git config user.name "kissa-bot"; git config user.email "actions@users.noreply.github.com"
          git add data stories && (git diff --cached --quiet || git commit -m "Yüklendi: $(date +%F)")
          git pull --rebase -q && git push
