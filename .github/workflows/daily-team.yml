name: Günlük AI Takımı (10 Short)

on:
  schedule:
    - cron: "23 1 * * *"   # her gün 04:23 Türkiye saati: plan + üretim, videolar gün içine zamanlanır
  workflow_dispatch:
    inputs:
      daily_videos:
        description: "Bugün kaç video (boş = config/schedule.json)"
        default: ""
      upload:
        description: "YouTube'a yükle (false = sadece üret, artifact olarak indir)"
        default: "true"

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

env:
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  AGENT_MODEL: ${{ vars.AGENT_MODEL || 'claude-opus-5-5' }}
  REVIEW_MODEL: ${{ vars.REVIEW_MODEL || 'claude-opus-5-5' }}
  YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
  YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
  YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}

jobs:
  plan:
    name: "1) Strateji ajanı + denetçisi: günün planı"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      indices: ${{ steps.plan.outputs.indices }}
      date: ${{ steps.plan.outputs.date }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - id: plan
        env:
          DAILY_VIDEOS: ${{ github.event.inputs.daily_videos }}
        run: |
          [ -z "$DAILY_VIDEOS" ] && unset DAILY_VIDEOS
          DATE=$(TZ=Europe/Istanbul date +%F)
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          python pipeline/team.py plan --date "$DATE"
      - name: Planı kaydet
        run: |
          git config user.name "kissa-bot"; git config user.email "actions@users.noreply.github.com"
          git add data && (git diff --cached --quiet || git commit -m "Plan: ${{ steps.plan.outputs.date }}")
          git pull --rebase -q && git push

  produce:
    name: "2) Üretim #${{ matrix.index }}"
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4        # ElevenLabs eşzamanlı istek sınırı için
      matrix:
        index: ${{ fromJson(needs.plan.outputs.indices) }}
    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_NARRATOR: ${{ secrets.ELEVENLABS_VOICE_NARRATOR }}
      ELEVENLABS_VOICE_OLD: ${{ secrets.ELEVENLABS_VOICE_OLD }}
      ELEVENLABS_VOICE_YOUNG: ${{ secrets.ELEVENLABS_VOICE_YOUNG }}
      ELEVENLABS_VOICE_WOMAN: ${{ secrets.ELEVENLABS_VOICE_WOMAN }}
      ELEVENLABS_VOICE_CHILD: ${{ secrets.ELEVENLABS_VOICE_CHILD }}
      ELEVENLABS_MODEL: ${{ vars.ELEVENLABS_MODEL || 'eleven_multilingual_v2' }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }   # plan commit'ini de al
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core && pip install -r requirements.txt
      - name: Senaryo, ses, görsel, yayın (+ denetçiler, baş denetçi), zamanla
        run: |
          FLAG=""; [ "${{ github.event.inputs.upload }}" = "false" ] && FLAG="--no-upload"
          python pipeline/team.py produce --date "${{ needs.plan.outputs.date }}" --index ${{ matrix.index }} $FLAG
      - name: Sonuç
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.index }}
          path: |
            output/results/
            output/*/*/story.json
            output/*/*/agent_log.jsonl
            output/*/*/final_sheet.jpg
          retention-days: 30
      - name: Video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ matrix.index }}
          path: output/*/*/*.mp4
          retention-days: 14

  finalize:
    name: "3) Günlük rapor ve arşiv"
    needs: [plan, produce]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with: { pattern: "result-*", merge-multiple: true, path: output }
      - run: python pipeline/team.py finalize --date "${{ needs.plan.outputs.date }}" | tee -a "$GITHUB_STEP_SUMMARY"
      - run: |
          git config user.name "kissa-bot"; git config user.email "actions@users.noreply.github.com"
          git add data reports stories && (git diff --cached --quiet || git commit -m "Rapor: ${{ needs.plan.outputs.date }}")
          git pull --rebase -q && git push
