name: Yayına giren videolara ilk yorum

on:
  schedule:
    - cron: "7 5-21/2 * * *"   # Türkiye 08:07 - 00:07 arası 2 saatte bir
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  comment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python pipeline/team.py comments
      - run: |
          git config user.name "kissa-bot"; git config user.email "actions@users.noreply.github.com"
          git add data && (git diff --cached --quiet || git commit -m "Yorumlar yazıldı")
          git pull --rebase -q && git push
